# Starter pyproject.toml for research_project_trade_pairs (tested with uv 0.11).
# Assumes the code is moved to src/pairs/. Adjust versions to what you actually test on.

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-pairs"
version = "0.1.0"
description = "Find, compare and backtest stock pairs for statistical-arbitrage pairs trading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "yfinance>=0.2.40",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs",
    "pre-commit>=3",
]

[project.scripts]
trade-pairs = "pairs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: errors, I: import order, B: bugbear, UP: pyupgrade, NPY: numpy, PD: pandas-vet, SIM: simplify
select = ["E", "F", "I", "B", "UP", "NPY", "PD", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true   # statsmodels/yfinance ship no stubs
# Tighten over time, module by module:
# [[tool.mypy.overrides]]
# module = "pairs.backtest"
# strict = true
